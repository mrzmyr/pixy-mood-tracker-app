appId: ${APP_ID}
tags: [p1, calendar]
---
# Behind the `calendar-view-all-moods` flag. With the flag on, days show a bar:
# one segment in the average mood, or one per entry after picking All Moods in
# the View section of the Filters menu. The choice survives a restart.
- runFlow:
    file: ../subflows/load-fixture.yaml
    env:
      FIXTURE: year
- runScript: ../scripts/set-output-date.js
- runFlow: ../subflows/enable-calendar-view.yaml

- assertVisible:
    id: "calendar-day-bar-average-${output.today}"

- tapOn: "Filters"
- tapOn: "All Moods"
- assertVisible:
    id: "calendar-day-bar-all-${output.today}"

# The view survives a restart.
- stopApp
- launchApp
- runFlow: ../subflows/enable-calendar-view.yaml
- extendedWaitUntil:
    visible:
      id: "calendar-day-bar-all-${output.today}"
    timeout: 10000

# The day still opens its entries.
- tapOn:
    id: "calendar-day-${output.today}"
- assertVisible: "Add Entry"
- tapOn:
    id: "log-list-close"

- tapOn: "Filters"
- tapOn: "Average Mood"
- assertVisible:
    id: "calendar-day-bar-average-${output.today}"
