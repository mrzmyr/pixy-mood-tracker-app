appId: ${APP_ID}
tags: [p0, onboarding]
---
# New user: personalized onboarding, first entry, entry survives a cold
# start.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "onboarding-welcome"
    timeout: 10000
- tapOn:
    id: "onboarding-start"
- tapOn:
    id: "onboarding-name"
- inputText: "Sam"
- hideKeyboard
- tapOn:
    id: "onboarding-name-next"
- assertVisible: "What brings you to Pixy, Sam?"
- tapOn:
    id: "onboarding-goal-what_helps"
- tapOn:
    id: "onboarding-goal-next"
- tapOn:
    id: "onboarding-struggle-focus"
- tapOn:
    id: "onboarding-struggles-next"
- tapOn:
    id: "onboarding-capture-next"
- assertVisible: "Your check-in is ready, Sam"
- assertVisible: "Focus"
- tapOn:
    id: "onboarding-summary-next"
- assertVisible: "Daily Reminder"
- tapOn: "Maybe later"
- assertVisible: "We take privacy serious and handle your data with care."
- runFlow: ../subflows/finish-privacy-slide.yaml
- assertVisible:
    id: "calendar-list"

- runFlow: ../subflows/create-basic-entry.yaml

- stopApp
- launchApp
- assertNotVisible:
    id: "onboarding-welcome"
- extendedWaitUntil:
    visible: "Add another entry for today"
    timeout: 10000
