appId: ${APP_ID}
tags: [tags]
---
- launchApp:
    clearState: true
- runFlow: ../subflows/complete-onboarding.yaml

# 4.1 Open Settings → Tags
- tapOn:
    id: "settings"
- tapOn: "Tags"
- assertVisible: "Create Tag"
- assertVisible: "Archive"

# 4.2 Create tag (retry tap if modal did not open)
- tapOn: "Create Tag"
- runFlow:
    when:
      notVisible:
        id: "tag-name"
    commands:
      - tapOn: "Create Tag"
- extendedWaitUntil:
    visible:
      id: "tag-name"
    timeout: 5000
- tapOn:
    id: "tag-name"
- inputText: "e2e-tag"
- runFlow: ../subflows/dismiss-keyboard.yaml
- tapOn: "Create"
# New tag is appended at the end of the list, below the fold
- scrollUntilVisible:
    element:
      text: "e2e-tag"
    direction: DOWN
    timeout: 15000
- assertVisible: "e2e-tag"

# 4.3 Edit tag: rename. iOS only: on Android, agent-device 0.21.14 types
# nothing into this prefilled field (manual edits and `fill` work), so the
# tag keeps its name there. Later steps accept either name.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "e2e-tag"
      - assertVisible: "Save"
      - tapOn:
          id: "tag-name"
      - eraseText
      - inputText: "e2e-renamed"
      - runFlow: ../subflows/dismiss-keyboard.yaml
      - tapOn: "Save"
      - scrollUntilVisible:
          element:
            text: "e2e-renamed"
          direction: DOWN
          timeout: 15000
      - assertVisible: "e2e-renamed"

# 4.4 Tag usable in logger
- back
- tapOn:
    id: "calendar"
- tapOn: "Add New Entry"
# A tap during the logger's slide-in animation is lost.
- waitForAnimationToEnd
- tapOn:
    id: "mood-neutral"
- runFlow: ../subflows/finish-logger.yaml
- assertVisible: "Add another entry for today"

# 4.5 Delete tag
- tapOn:
    id: "settings"
- tapOn: "Tags"
- scrollUntilVisible:
    element:
      text: "e2e-(tag|renamed)"
    direction: DOWN
    timeout: 15000
- tapOn: "e2e-(tag|renamed)"
- scrollUntilVisible:
    element:
      text: "Delete"
    direction: DOWN
    timeout: 15000
- tapOn: "Delete"
- assertVisible: "The tag will be removed from all entries.*"
- tapOn:
    text: "Delete"
    index: 0
- assertNotVisible: "e2e-(tag|renamed)"
