appId: com.devmood.pixymoodtracker
tags: [calendar]
---
- launchApp
- runFlow:
    when:
      visible: "Welcome 👋"
    commands:
      - runFlow: ../subflows/complete-onboarding.yaml
- tapOn:
    id: "calendar"

# 3.1 Calendar renders with today cell
- assertVisible:
    id: "calendar"
- runScript: ../scripts/set-output-date.js
- assertVisible:
    id: "calendar-day-${output.today}"

# 3.2 Find the historical date. Short swipes avoid skipping past older cells.
- repeat:
    times: 120
    while:
      notVisible:
        id: "calendar-day-2023-09-24"
    commands:
      - swipe:
          start: 50%, 65%
          end: 50%, 55%
- assertVisible:
    id: "calendar-day-2023-09-24"
- tapOn:
    id: "calendar-day-2023-09-24"
- runFlow:
    when:
      visible: "How was your day?"
    commands:
      - tapOn:
          id: "mood-good"
      - runFlow: ../subflows/finish-logger.yaml
- runFlow:
    when:
      visible: "Add Entry"
    commands:
      - back
- repeat:
    times: 120
    while:
      notVisible:
        id: "calendar-day-2023-09-24"
    commands:
      - swipe:
          start: 50%, 65%
          end: 50%, 55%
- assertVisible:
    id: "calendar-day-2023-09-24"
- repeat:
    times: 120
    while:
      notVisible:
        id: "calendar-day-2022-09-24"
    commands:
      - swipe:
          start: 50%, 65%
          end: 50%, 55%
- assertVisible:
    id: "calendar-day-2022-09-24"
- repeat:
    times: 120
    while:
      notVisible:
        id: "calendar-day-2021-09-24"
    commands:
      - swipe:
          start: 50%, 65%
          end: 50%, 55%
- assertVisible:
    id: "calendar-day-2021-09-24"

# 3.4 Scroll back several months (bounded swipes that stay off the tab bar)
- swipe:
    start: 50%, 30%
    end: 50%, 65%
- swipe:
    start: 50%, 30%
    end: 50%, 65%
- swipe:
    start: 50%, 30%
    end: 50%, 65%

# 3.5 Return to today (re-enter calendar tab, then scroll; use button if present)
- tapOn:
    id: "calendar"
- runFlow:
    when:
      visible:
        id: "scroll-to-bottom"
    commands:
      - tapOn:
          id: "scroll-to-bottom"
- runFlow:
    when:
      notVisible:
        id: "calendar-day-${output.today}"
    commands:
      - scrollUntilVisible:
          element:
            id: "calendar-day-${output.today}"
          direction: DOWN
          timeout: 60000
          speed: 60
          visibilityPercentage: 50

# 3.6 Filters open, search visible, close
- tapOn:
    point: 76%,7%
- assertVisible: "Filters"
- assertVisible: "Search"
- runFlow:
    when:
      visible:
        id: "calendar-filter-done"
    commands:
      - tapOn:
          id: "calendar-filter-done"
- runFlow:
    when:
      notVisible:
        id: "calendar-filter-done"
    commands:
      - back
# Closing filters can land on the Statistics tab (app behavior) — re-enter calendar
- tapOn:
    id: "calendar"
- assertVisible:
    id: "calendar-day-${output.today}"
