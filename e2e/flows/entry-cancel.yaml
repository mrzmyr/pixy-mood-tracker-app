appId: ${APP_ID}
tags: [p0, entry]
---
# Closing the logger without saving keeps stored data unchanged.
- runFlow:
    file: ../subflows/load-fixture.yaml
    env:
      FIXTURE: empty
- runScript: ../scripts/set-output-date.js

# New entry: Keep Editing stays, Discard Changes saves nothing.
- tapOn: "Add New Entry"
- assertVisible: "How was your day?"
- waitForAnimationToEnd
- tapOn:
    id: "mood-good"
- assertVisible: "How did you feel?"
- tapOn: "Happy"
- tapOn:
    id: "logger-close"
- assertVisible: "Your changes will be lost."
- tapOn: "Keep Editing"
- assertVisible: "How did you feel?"
- tapOn:
    id: "logger-close"
- tapOn: "Discard Changes"
- assertVisible: "Add New Entry"

# Edit: discarded changes do not replace the saved entry.
- runFlow: ../subflows/create-basic-entry.yaml
- tapOn:
    id: "calendar-day-${output.today}"
- tapOn:
    id: "log-list-edit"
    index: 0
- assertVisible: "How was your day?"
- waitForAnimationToEnd
- tapOn:
    id: "mood-bad"
- assertVisible: "How did you feel?"
- tapOn:
    id: "logger-next"
- tapOn:
    id: "logger-next"
- assertVisible:
    id: "log-message"
- tapOn:
    id: "log-message"
- inputText: "e2e discarded ${output.runId}"
- tapOn:
    id: "logger-close"
- tapOn: "Discard Changes"
- assertNotVisible: "e2e discarded ${output.runId}"
- tapOn:
    id: "log-list-close"

- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Add another entry for today"
    timeout: 10000
- tapOn:
    id: "calendar-day-${output.today}"
- assertNotVisible: "e2e discarded ${output.runId}"
- tapOn:
    id: "log-list-close"
