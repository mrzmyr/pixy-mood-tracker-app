appId: ${APP_ID}
tags: [log, smoke]
---
- launchApp:
- runScript: ../scripts/set-output-date.js
# Keep the profile at one or fewer entries so both saves avoid Product Questions.
- runFlow:
    when:
      visible: "Welcome 👋"
    commands:
      - runFlow: ../subflows/complete-onboarding.yaml

# 2.1 Create entry for today and manage tags from logger
- runFlow:
    when:
      visible: "Add New Entry"
    commands:
      - tapOn: "Add New Entry"
- runFlow:
    when:
      visible: "Add another entry for today"
    commands:
      - tapOn: "Add another entry for today"
- assertVisible: "How was your day?"
# A tap during the logger's slide-in animation is lost.
- waitForAnimationToEnd
- tapOn:
    id: "mood-good"
- tapOn:
    id: "logger-next"
- assertVisible: "Add tags"

# 2.2 Create and rename a tag from the logger
- scrollUntilVisible:
    element:
      text: "Edit Tags"
    direction: DOWN
    timeout: 15000
- tapOn: "Edit Tags"
- tapOn: "Create Tag"
- tapOn:
    id: "tag-name"
- inputText: "e2e-log-${output.runId}"
- hideKeyboard
- tapOn:
    text: "Create"
    point: "50%,45%"
- assertVisible: "Tags"
- scrollUntilVisible:
    element:
      text: "e2e-log-${output.runId}"
    direction: DOWN
    timeout: 15000
- assertVisible: "e2e-log-${output.runId}"
- tapOn: "e2e-log-${output.runId}"
- assertVisible: "Edit Tag"
- tapOn:
    id: "tag-name"
- eraseText
- inputText: "e2e-renamed-${output.runId}"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Save"
    direction: DOWN
    timeout: 15000
- tapOn: "Save"
- assertVisible: "Tags"
- assertVisible: "e2e-renamed-${output.runId}"

# 2.3 Delete another tag through logger tag management
- tapOn: "Create Tag"
- tapOn:
    id: "tag-name"
- inputText: "e2e-temp-${output.runId}"
- hideKeyboard
- tapOn:
    text: "Create"
    point: "50%,45%"
- assertVisible: "Tags"
- scrollUntilVisible:
    element:
      text: "e2e-temp-${output.runId}"
    direction: DOWN
    timeout: 15000
- assertVisible: "e2e-temp-${output.runId}"
- tapOn: "e2e-temp-${output.runId}"
- scrollUntilVisible:
    element:
      text: "Delete"
    direction: DOWN
    timeout: 15000
- tapOn: "Delete"
- assertVisible: "The tag will be removed from all entries.*"
- tapOn:
    text: "Delete"
    index: 0
- assertVisible: "Tags"
- assertNotVisible: "e2e-temp-${output.runId}"

# 2.4 Android system Back returns from tag manager to logger
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: BACK
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Done"
- assertVisible: "Add tags"
- tapOn: "e2e-renamed-${output.runId}"
- tapOn:
    id: "logger-next"
- assertVisible: "Write about your day"
- inputText: "e2e note ${output.runId} persisted"
- hideKeyboard
- runFlow:
    when:
      visible:
        id: "logger-save"
    commands:
      - tapOn:
          id: "logger-save"
- runFlow:
    when:
      notVisible:
        id: "logger-save"
    commands:
      - tapOn:
          id: "logger-next"
      - tapOn: "Not Now"
- assertVisible: "Add another entry for today"

# 2.5 Saved tag and note appear in the entry
- tapOn:
    id: "calendar-day-${output.today}"
- scrollUntilVisible:
    element:
      text: "e2e note ${output.runId} persisted"
    direction: DOWN
    timeout: 15000
- assertVisible: "e2e-renamed-${output.runId}"
- assertVisible: "e2e note ${output.runId} persisted"
- tapOn:
    id: "log-list-close"

# 2.6 Second entry for today (different rating)
- back
- tapOn: "Add another entry for today"
- assertVisible: "How was your day?"
# A tap during the logger's slide-in animation is lost.
- waitForAnimationToEnd
- tapOn:
    id: "mood-very_good"
- runFlow: ../subflows/finish-logger-with-reminder.yaml
- assertVisible: "Add another entry for today"
