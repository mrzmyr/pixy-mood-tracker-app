appId: ${APP_ID}
tags: [p1, location]
---
# With the `location` flag and setting on, a new entry gets the current place.
# The user changes it to another place before saving.
# Place names come from the system geocoder and need a network. Without a
# position fix (simulator location unset) the entry starts with "Add Location".
- runFlow:
    file: ../subflows/load-fixture.yaml
    env:
      FIXTURE: empty
- runFlow:
    file: ../subflows/enable-feature-flag.yaml
    env:
      FLAG: location

# Turn location on in Settings > Check-in. It is off by default.
- runFlow: ../subflows/open-settings.yaml
- tapOn: "Check-in"
- scrollUntilVisible:
    element:
      id: "location-enabled"
    direction: DOWN
- tapOn:
    id: "location-enabled"
# The switch asks for location access once.
- runFlow:
    when:
      platform: iOS
      visible: "Allow While Using App"
    commands:
      - tapOn: "Allow While Using App"
- runFlow:
    when:
      platform: Android
      visible: "While using the app"
    commands:
      - tapOn: "While using the app"
# Back on the calendar, iOS reports an empty accessibility tree. Relaunch
# instead. Flag overrides end on restart, so turn the flag on again.
- stopApp
- launchApp
- runFlow:
    file: ../subflows/enable-feature-flag.yaml
    env:
      FLAG: location

# The new entry shows the time bottom left and the place bottom right.
- tapOn:
    id: "calendar-add-entry"
- waitForAnimationToEnd
- assertVisible:
    id: "logger-date"
- assertVisible:
    id: "logger-location"

# Change the place to Hamburg.
- tapOn:
    id: "logger-location"
- tapOn:
    id: "location-search"
- inputText: "Hamburg"
- extendedWaitUntil:
    visible:
      id: "location-result-0"
    timeout: 15000
- tapOn:
    id: "location-result-0"
- extendedWaitUntil:
    visible: ".*Hamburg.*"
    timeout: 5000

- tapOn:
    id: "mood-good"
- runFlow: ../subflows/finish-logger.yaml
- runFlow: ../subflows/close-confirmation.yaml
