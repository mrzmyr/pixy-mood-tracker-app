appId: ${APP_ID}
tags: [p1, widget]
---
# iOS only: the 3rd logged day opens the widget guide once; Settings reopens it.
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          file: ../subflows/load-fixture.yaml
          env:
            FIXTURE: two-days
      - runFlow: ../subflows/create-basic-entry.yaml
      # Guide intro slides up after the save.
      - assertVisible: "Add widget"
      - tapOn:
          id: "widget-guide-next"
      - assertVisible: "Touch and hold the Home Screen"
      - tapOn:
          id: "widget-guide-next"
      - tapOn:
          id: "widget-guide-next"
      - assertVisible: "Search for Pixy and pick a size"
      - tapOn:
          id: "widget-guide-next"
      - assertVisible: "Add another entry for today"
      # Second entry on the same day: no second nudge.
      - tapOn:
          id: "calendar-day-${output.today}"
      - assertNotVisible: "Add widget"
      - tapOn:
          id: "log-list-close"
      # Settings keeps the guide reachable.
      - tapOn:
          id: "settings"
      - tapOn:
          id: "widget"
      - assertVisible: "Add widget"
      - tapOn:
          id: "widget-guide-secondary"
      - assertVisible: "Settings"
