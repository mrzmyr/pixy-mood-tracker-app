appId: ${APP_ID}
tags: [p1, filters]
---
# Search and tag filters narrow the `year` fixture to exact counts.
# iOS checks counts inside the sheet. Android checks the menu badge, which
# TalkBack reads as "More, <count>".
- runFlow:
    file: ../subflows/load-fixture.yaml
    env:
      FIXTURE: year
- runFlow: ../subflows/open-filters.yaml
- tapOn:
    id: "calendar-filter-search"
- inputText: "run"
- runFlow: ../subflows/dismiss-keyboard.yaml
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: "41 Results"
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: "More, 1"
- tapOn: "Sport"
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: "10 Results"
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: "More, 2"

# Closing clears both filters. Reopening shows no results.
- runFlow: ../subflows/close-filters.yaml
- runFlow: ../subflows/open-filters.yaml
- assertNotVisible: ".* Results"
- runFlow: ../subflows/close-filters.yaml
