appId: ${APP_ID}
tags: [p1, filters]
---
# Search and tag filters narrow the `year` fixture to exact counts.
# iOS checks counts inside the sheet. Android checks the filter badge.
- runFlow:
    file: ../subflows/load-fixture.yaml
    env:
      FIXTURE: year
- tapOn:
    id: "filters"
- tapOn:
    id: "calendar-filter-search"
- inputText: "run"
- runFlow: ../subflows/dismiss-keyboard.yaml
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: "41 Results"
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: "Filters \\(1\\)"
- tapOn: "Sport"
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: "10 Results"
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: "Filters \\(2\\)"

# Closing keeps both filters: the header badge shows them, and reopening
# shows the same results. Reset clears them.
- runFlow: ../subflows/close-filters.yaml
- assertVisible: "Filters \\(2\\)"
- tapOn:
    id: "filters"
- assertVisible:
    id: "calendar-filter-search"
- assertVisible: "10 Results"
# Reset shares the result row; scroll in case the sheet cuts it off.
- scrollUntilVisible:
    element:
      id: "calendar-filter-reset"
    direction: DOWN
- tapOn:
    id: "calendar-filter-reset"
- assertNotVisible: ".* Results"
- assertNotVisible:
    id: "calendar-filter-reset"
- runFlow: ../subflows/close-filters.yaml
- assertNotVisible: "Filters \\(.*\\)"
