appId: ${APP_ID}
tags: [p1, filters]
---
# Search and tag filters narrow the `year` fixture to exact counts.
# iOS checks counts inside the sheet. Android checks the filter badge.
- runFlow:
    file: ../subflows/load-fixture.yaml
    env:
      FIXTURE: year
- tapOn:
    id: "filters"
- assertVisible: "Filters"
- tapOn:
    id: "calendar-filter-search"
- inputText: "run"
- runFlow: ../subflows/dismiss-keyboard.yaml
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: "41 Results"
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: "Filters \\(1\\)"
- tapOn: "Sport"
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: "10 Results"
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: "Filters \\(2\\)"

# Reset clears both filters.
- tapOn: "Reset"
- runFlow:
    when:
      platform: iOS
    commands:
      - assertNotVisible: "10 Results"
- runFlow:
    when:
      platform: Android
    commands:
      - assertNotVisible: "Filters \\(.*\\)"

- runFlow: ../subflows/close-filters.yaml

# A sheet retained by an inactive Calendar tab must not consume Back on
# Settings subpages. Refocusing Calendar restores the sheet's Back handler.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "filters"
      - assertVisible:
          id: "calendar-filter-search"
      - tapOn:
          id: "settings"
      - assertVisible: "Check-in"
      - tapOn: "Data"
      - back
      - assertVisible: "Check-in"
      - tapOn:
          id: "calendar"
      - assertVisible:
          id: "calendar-filter-search"
      - back
      - assertVisible:
          id: "calendar-list"
      - assertNotVisible:
          id: "calendar-filter-search"
      - tapOn:
          id: "calendar"
      - assertNotVisible:
          id: "calendar-filter-search"
