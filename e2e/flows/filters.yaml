appId: ${APP_ID}
tags: [p1, filters]
---
# Search and tag filters narrow the `year` fixture to exact counts shown in
# the sheet. The Android sheet is its own window, so the header badge is not
# in the hierarchy while it is open.
- runFlow:
    file: ../subflows/load-fixture.yaml
    env:
      FIXTURE: year
- runFlow: ../subflows/open-filters.yaml
- tapOn:
    id: "calendar-filter-search"
- inputText: "run"
- runFlow: ../subflows/dismiss-keyboard.yaml
- assertVisible: "41 Results"
- tapOn: "Sport"
- assertVisible: "10 Results"

# Closing keeps both filters: Android reads the header badge, and reopening
# shows the same results. Reset clears them.
- runFlow: ../subflows/close-filters.yaml
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: "Filters, 2"
- runFlow: ../subflows/open-filters.yaml
- assertVisible: "10 Results"
# Reset shares the result row; scroll in case the sheet cuts it off.
- scrollUntilVisible:
    element:
      id: "calendar-filter-reset"
    direction: DOWN
- tapOn:
    id: "calendar-filter-reset"
- assertNotVisible: ".* Results"
- assertNotVisible:
    id: "calendar-filter-reset"
- runFlow: ../subflows/close-filters.yaml
