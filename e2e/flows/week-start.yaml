appId: ${APP_ID}
tags: [p1, calendar, settings]
---
- runFlow:
    file: ../subflows/load-fixture.yaml
    env:
      FIXTURE: year
- tapOn:
    id: "settings"
- tapOn:
    id: "week-start"
- tapOn:
    id: "week-start-sunday"
- tapOn:
    id: "calendar"
- assertVisible:
    id: "calendar-weekday-0"
    text: "Sun"

# Stored choice survives cold restart and frozen tab resumes.
- stopApp
- launchApp
- assertVisible:
    id: "calendar-weekday-0"
    text: "Sun"
- tapOn:
    id: "settings"
- tapOn:
    id: "week-start"
- tapOn:
    id: "week-start-monday"
- tapOn:
    id: "calendar"
- assertVisible:
    id: "calendar-weekday-0"
    text: "Mon"

# Dismissal preserves choice; System can be restored.
- tapOn:
    id: "settings"
- tapOn:
    id: "week-start"
- tapOn:
    id: "week-start-cancel"
- tapOn:
    id: "calendar"
- assertVisible:
    id: "calendar-weekday-0"
    text: "Mon"
- tapOn:
    id: "settings"
- tapOn:
    id: "week-start"
- tapOn:
    id: "week-start-system"
- tapOn:
    id: "calendar"
- assertVisible:
    id: "calendar-weekday-0"
