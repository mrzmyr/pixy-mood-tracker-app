appId: com.devmood.pixymoodtracker
name: Entry survives a kill right after saving
tags: [data-integrity]
---
# Catches: an entry lost when the app is killed right after saving (#215).
# 10-stability kills after more interaction; this kills immediately.
- launchApp:
    clearState: true
- runFlow: ../subflows/complete-onboarding.yaml
- runScript: ../scripts/set-output-date.js

- tapOn: "Add New Entry"
- tapOn:
    id: "mood-good"
- runFlow: ../subflows/finish-logger.yaml
- stopApp
- launchApp
- tapOn:
    text: "Not Now"
    optional: true

- runFlow:
    file: ../subflows/assert-day-has-entry.yaml
    env:
      DATE: ${output.today}
