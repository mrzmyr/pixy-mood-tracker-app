appId: ${APP_ID}
tags: [p0, upgrade]
---
# Users on 1.81.1 upgrade without data loss. Loads 1.81.1 storage as written by
# that version, restarts, and checks entries, tags, and a first new entry.
- runFlow:
    file: ../subflows/load-storage-fixture.yaml
    env:
      FIXTURE: legacy-1.81.1
- runFlow: ../subflows/verify-upgrade.yaml

# Tags keep titles and archive state. They live under Check-in > Tags.
- runFlow: ../subflows/open-settings.yaml
- scrollUntilVisible:
    element:
      text: "Check-in"
    direction: UP
- tapOn: "Check-in"
- tapOn:
    id: "step-tags"
- assertVisible: "Legacy custom"
- assertVisible: "Work 💼"
- assertNotVisible: "Legacy archived"
