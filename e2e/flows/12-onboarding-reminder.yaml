appId: ${APP_ID}
tags: [onboarding, reminder]
---
# Reusable on installed devices; do not clear app data.
- stopApp
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions:
            notifications: allow
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp
- runFlow:
    when:
      visible: "Reminder"
    commands:
      - back
- runFlow:
    when:
      visible:
        id: "calendar"
    commands:
      - tapOn:
          id: "settings"
      - scrollUntilVisible:
          element:
            text: "Onboarding"
          direction: DOWN
      - tapOn: "Onboarding"

- assertVisible: "Welcome 👋"
- tapOn: "Start"
- tapOn: "Next"
- tapOn: "Next"
- tapOn: "Next"
- assertVisible: "Daily Reminder"
- tapOn: "Enable Reminder"
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow: ../subflows/dismiss-no-push-alerts.yaml
- assertVisible: "We take privacy serious and handle your data with care."
- tapOn: "Understood"
- tapOn:
    id: "settings"
- scrollUntilVisible:
    element:
      id: "reminder"
    direction: UP
- tapOn:
    id: "reminder"
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: "Time"
- runFlow:
    when:
      platform: iOS
    commands:
      - assertNotVisible: "Time"
