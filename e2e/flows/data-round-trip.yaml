appId: ${APP_ID}
tags: [p1, data]
---
# Export all data, reset, then import the export. All 365 entries return.
- runFlow:
    file: ../subflows/load-fixture.yaml
    env:
      FIXTURE: year
- tapOn:
    id: "settings"
- tapOn:
    id: "data"

# iOS: save the export to Files. Share sheet and file picker are remote views
# without accessibility nodes, so taps use screen positions.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Export"
      - runFlow: ../subflows/pause.yaml
      # "Save to Files"
      - tapOn:
          point: 61%,89%
      - runFlow: ../subflows/pause.yaml
      # "Save"
      - tapOn:
          point: 87%,13%
      - runFlow: ../subflows/pause.yaml
      # "Replace" when a same-day export exists. Else empty screen space.
      - tapOn:
          point: 50%,54%
      - runFlow: ../subflows/pause.yaml
      - assertVisible: "Export all data as a JSON file"

# Reset leaves an empty calendar. Regression: a stale calendar footer kept
# "Add another entry for today" after reset (src/screens/Calendar/index.tsx).
- scrollUntilVisible:
    element:
      id: "reset-data"
    direction: DOWN
- tapOn:
    id: "reset-data"
- assertVisible: "Are you sure you want to reset all entries and tags?"
- tapOn:
    text: "Reset"
    below: "Are you sure you want to reset all entries and tags?"
- assertVisible: "All data has been reset."
- tapOn: "OK"
- back
- tapOn:
    id: "calendar"
- assertVisible: "Add New Entry"

# iOS: import the newest file in Recents.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "settings"
      - tapOn:
          id: "data"
      - tapOn: "Import"
      - assertVisible: "Are you sure you want to import data?.*"
      - tapOn:
          text: "Import"
          below: "Are you sure you want to import data?.*"
      - runFlow: ../subflows/pause.yaml
      # First file in Recents
      - tapOn:
          point: 17%,30%
      - extendedWaitUntil:
          visible: "Import successful"
          timeout: 10000
      - tapOn: "Ok"
      - back
      - scrollUntilVisible:
          element:
            text: "Statistics for Nerds"
          direction: DOWN
      - tapOn: "Statistics for Nerds"
      - assertVisible: "365"
