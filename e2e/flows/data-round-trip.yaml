appId: ${APP_ID}
tags: [p1, data]
---
# Export all data, reset, then import the export. All 365 entries return.
# The share sheet and document picker are system screens, so the flow swaps
# them for a fake that keeps the exported file (src/dev/fakeFileTransfer.ts).
# Check the real system screens by hand before a release.
- runFlow:
    file: ../subflows/load-fixture.yaml
    env:
      FIXTURE: year
- openLink: ${APP_SCHEME}://dev/fake-files
- extendedWaitUntil:
    visible:
      id: "calendar"
    timeout: 10000

- tapOn:
    id: "settings"
- tapOn:
    id: "data"
- tapOn: "Export"

# Reset leaves an empty calendar. Regression: a stale calendar footer kept
# "Add another entry for today" after reset (src/screens/Calendar/index.tsx).
- scrollUntilVisible:
    element:
      id: "reset-data"
    direction: DOWN
- tapOn:
    id: "reset-data"
- assertVisible: "Are you sure you want to reset all entries and tags?"
- tapOn:
    text: "Reset"
    below: "Are you sure you want to reset all entries and tags?"
- assertVisible: "All data has been reset."
- tapOn: "OK"
- back
- tapOn:
    id: "calendar"
- assertVisible: "Add New Entry"

# Import the exported file.
- tapOn:
    id: "settings"
- tapOn:
    id: "data"
- tapOn: "Import"
- assertVisible: "Are you sure you want to import data?.*"
- tapOn:
    text: "Import"
    below: "Are you sure you want to import data?.*"
- extendedWaitUntil:
    visible: "Import successful"
    timeout: 10000
- tapOn: "Ok|OK"
- back
- scrollUntilVisible:
    element:
      text: "Statistics for Nerds"
    direction: DOWN
- tapOn: "Statistics for Nerds"
- assertVisible: "365"
