appId: ${APP_ID}
tags: [settings, reminder]
---
- runFlow:
    file: ../subflows/load-fixture.yaml
    env:
      FIXTURE: empty

# 7.1 Open Settings → Reminder
- tapOn:
    id: "settings"
- tapOn:
    id: "reminder"
- assertVisible: "Reminder"

# 7.2 Enable reminder toggle
- tapOn:
    id: "reminder-enabled"
- runFlow: ../subflows/dismiss-no-push-alerts.yaml

# 7.3 Disable again
- tapOn:
    id: "reminder-enabled"
- runFlow: ../subflows/dismiss-no-push-alerts.yaml
- back
- assertVisible: "Settings"
