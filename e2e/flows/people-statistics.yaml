appId: ${APP_ID}
tags: [p1, people]
---
# With the `people` flag on, the Statistics tab shows who the user saw most
# in the last 14 days, and the full highlights list the people cards.
- runFlow:
    file: ../subflows/load-fixture.yaml
    env:
      FIXTURE: people
- openLink: ${APP_SCHEME}://dev/feature-flag?key=people&value=on
- extendedWaitUntil:
    visible:
      id: "calendar-list"
    timeout: 10000

- runFlow: ../subflows/open-statistics.yaml
- assertVisible: "Highlights"
- scrollUntilVisible:
    element:
      text: "Most seen people in the last 14 days."
    direction: DOWN
- assertVisible: "Sam"

# Tapping Sam filters the calendar to entries with Sam.
- tapOn:
    id: "statistics-person-7f1d6a3e-0001-4a3e-8f6e-0f0000000001"
- extendedWaitUntil:
    visible:
      id: "calendar-list"
    timeout: 10000
- assertVisible: "Filters \\(1\\)"
