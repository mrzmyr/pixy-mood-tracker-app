appId: com.devmood.pixymoodtracker
---
# Creates the first basic entry for today (rating "good", skips optional steps).
# Assumes fresh state on the Calendar tab.
- tapOn:
    text: "Add New Entry"
    waitToSettleTimeoutMs: 300
- assertVisible: "How was your day?"
- tapOn:
    id: "mood-good"
    waitToSettleTimeoutMs: 300
- runFlow: finish-logger.yaml
- assertVisible: "Add another entry for today"
