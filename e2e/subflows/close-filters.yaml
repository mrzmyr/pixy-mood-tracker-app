appId: ${APP_ID}
---
# iOS closes by tapping outside the sheet. Android Back closes the sheet and
# keeps Calendar. Closing clears all filters.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: "50%,15%"
      - waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      - back
- assertVisible:
    id: "calendar-list"
- assertNotVisible:
    id: "calendar-filter-search"
- assertNotVisible: "More, .*"
