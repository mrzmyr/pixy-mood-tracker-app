appId: ${APP_ID}
---
# iOS closes through Done. Android Back closes the sheet and keeps Calendar.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "calendar-filter-done"
      - waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      - back
- assertVisible:
    id: "calendar-list"
- assertNotVisible:
    id: "calendar-filter-search"
