appId: ${APP_ID}
---
# iOS closes by tapping outside the sheet. Android Back closes the sheet and
# keeps Calendar. Closing keeps the filters; the sheet's Reset clears them.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: "50%,15%"
      - waitForAnimationToEnd
# Back collapses a fully expanded Android sheet to half height first, so a
# sheet still on screen takes a second Back.
- runFlow:
    when:
      platform: Android
    commands:
      - back
      - runFlow:
          when:
            visible:
              id: "calendar-filter-search"
          commands:
            - back
- assertVisible:
    id: "calendar-list"
- assertNotVisible:
    id: "calendar-filter-search"
