appId: ${APP_ID}
---
# Replaces all app data with fixture ${FIXTURE} from src/dev/fixtures and
# opens the calendar at today. Not for `fresh`, which opens onboarding. Needs
# a development or preview build. Works on phones, where clearState is not
# available.
# A `when: visible` condition waits 7 seconds when its element is absent, so
# conditions here check the platform or run only where the element is likely.
- launchApp
- openLink: ${APP_SCHEME}://dev/fixture?id=${FIXTURE}
# iOS asks once per app before a custom-scheme link opens it. Android never asks.
- waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          when:
            visible: "Open"
          commands:
            - tapOn: "Open"
# Replaced data can leave the calendar above today without the scroll-to-bottom
# button. Today is the last day in the list, so scroll down to it.
- runScript: ../scripts/set-output-date.js
- scrollUntilVisible:
    element:
      id: "calendar-day-${output.today}"
    direction: DOWN
    timeout: 10000
