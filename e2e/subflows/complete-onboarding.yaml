- assertVisible: "Welcome 👋"
- tapOn:
    text: "I never used a Mood Tracker"
    waitToSettleTimeoutMs: 300
- tapOn:
    text: "Next"
    waitToSettleTimeoutMs: 300
- tapOn:
    text: "Next"
    waitToSettleTimeoutMs: 300
- tapOn:
    text: "Next"
    waitToSettleTimeoutMs: 300
- tapOn:
    text: "Maybe later"
    waitToSettleTimeoutMs: 300
- tapOn:
    text: "Understood"
    waitToSettleTimeoutMs: 300
