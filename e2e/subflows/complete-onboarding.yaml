appId: ${APP_ID}
---
# Completes onboarding from the tagline screen to the Calendar tab.
- extendedWaitUntil:
    visible:
      id: "onboarding-welcome"
    timeout: 10000
- tapOn:
    id: "onboarding-start"
# No answers: every question keeps its default.
- tapOn:
    id: "onboarding-name-next"
- tapOn:
    id: "onboarding-goal-next"
- tapOn:
    id: "onboarding-struggles-next"
- tapOn:
    id: "onboarding-capture-next"
- tapOn:
    id: "onboarding-summary-next"
- tapOn:
    text: "Maybe later"
- runFlow: finish-privacy-slide.yaml
