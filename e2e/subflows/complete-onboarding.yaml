appId: ${APP_ID}
---
# Completes onboarding from the tagline screen to the Calendar tab.
- extendedWaitUntil:
    visible:
      id: "onboarding-welcome"
    timeout: 10000
- tapOn:
    id: "onboarding-start"
- tapOn:
    text: "Next"
- tapOn:
    text: "Next"
- tapOn:
    text: "Next"
- tapOn:
    text: "Maybe later"
- runFlow: finish-privacy-slide.yaml
