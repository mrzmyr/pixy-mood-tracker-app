appId: ${APP_ID}
---
# Writes storage fixture ${FIXTURE} (raw AsyncStorage of an old version) and
# restarts the app, so stores read it like an upgrade does.
- launchApp
- openLink: ${APP_SCHEME}://dev/fixture?id=${FIXTURE}
- waitForAnimationToEnd
# iOS asks once per app before a custom-scheme link opens it. Android never asks.
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          when:
            visible: "Open"
          commands:
            - tapOn: "Open"
- extendedWaitUntil:
    visible: "Storage written.*"
    timeout: 10000
- stopApp
- launchApp
