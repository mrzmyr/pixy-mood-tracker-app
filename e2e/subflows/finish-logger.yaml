appId: com.devmood.pixymoodtracker
---
# Walks the deterministic default first-entry sequence after mood auto-advance:
# emotions → tags → message → save.
- tapOn:
    id: "logger-next"
    waitToSettleTimeoutMs: 1200
- tapOn:
    id: "logger-next"
    waitToSettleTimeoutMs: 1200
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- tapOn:
    id: "logger-save"
    waitToSettleTimeoutMs: 1200
