appId: ${APP_ID}
---
# Adds one entry in the old 1.81.1 app through its UI. Its React Native 0.69
# buttons do not take label taps, so taps use screen positions (iPhone 17 Pro).
- launchApp
- tapOn: "I never used a Mood Tracker"
- waitForAnimationToEnd
# Skip
- tapOn:
    point: 88%,55%
- waitForAnimationToEnd
# Add today's entry
- tapOn:
    point: 50%,52%
- waitForAnimationToEnd
# Mood: good
- tapOn:
    point: 50%,45%
- waitForAnimationToEnd
# Sleep: fourth of five
- tapOn:
    point: 68%,30%
- waitForAnimationToEnd
# Emotions: Happy, Calm, then Next
- tapOn:
    point: 26%,33%
- tapOn:
    point: 71%,46%
- tapOn:
    point: 85%,91%
- waitForAnimationToEnd
# Tags: Family, Sport, then Next
- tapOn:
    point: 21%,27%
- tapOn:
    point: 50%,33%
- tapOn:
    point: 85%,91%
- waitForAnimationToEnd
# Note field has focus.
- inputText: "written by old app"
- runFlow: ../subflows/pause.yaml
# Save. Percentages resolve wrong while the keyboard is open, so use points.
- tapOn:
    point: 342,483
- waitForAnimationToEnd
- assertVisible: ".*Add another entry for today.*"
- stopApp
