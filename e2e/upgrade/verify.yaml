appId: ${APP_ID}
---
# Runs on the current build after it replaced an old build seeded by
# seed-<version>.yaml. Checks the old entry, a first new entry, and a cold start.
- runScript: ../scripts/set-output-date.js
- launchApp
- extendedWaitUntil:
    visible: "Add another entry for today"
    timeout: 15000
- assertNotVisible: "Welcome 👋"
- tapOn:
    id: "calendar-day-${output.today}"
- assertVisible: "written by old app"
- assertVisible: "Happy"
- assertVisible: "Calm"
- assertVisible: "Family 🏡"
- assertVisible: "Sport 🏃‍♂️"
- tapOn:
    id: "log-list-close"

# First write after the upgrade. The second-ever entry adds the reminder slide.
- tapOn: "Add another entry for today"
- assertVisible: "How was your day?"
- waitForAnimationToEnd
- tapOn:
    id: "mood-very_good"
- tapOn:
    id: "logger-next"
- tapOn:
    id: "logger-next"
- assertVisible: "Write about your day…"
- tapOn:
    id: "log-message"
- inputText: "written after upgrade"
- tapOn:
    id: "logger-next"
- tapOn: "Maybe later"

- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Add another entry for today"
    timeout: 15000
- tapOn:
    id: "calendar-day-${output.today}"
- assertVisible: "written by old app"
- swipe:
    start: 80%, 50%
    end: 20%, 50%
- assertVisible: "written after upgrade"
