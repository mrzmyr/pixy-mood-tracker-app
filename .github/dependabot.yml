# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/" # Location of package manifests
    schedule:
      interval: "monthly"
    # Wait a week before adopting new releases, so compromised versions are caught first.
    cooldown:
      default-days: 7
    # The Expo SDK pins these packages (node_modules/expo/bundledNativeModules.json).
    # Bumped alone, they break native builds that CI does not run, e.g. #363.
    # Patches move together in one PR; minor and major versions only move with
    # an SDK upgrade: `bunx expo install expo@^<sdk> --fix`.
    groups:
      expo-sdk:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "jest-expo"
          - "@react-native-async-storage/async-storage"
          - "@react-native-community/datetimepicker"
          - "@sentry/react-native"
          - "@shopify/flash-list"
          - "react"
          - "react-dom"
          - "react-native"
          - "react-native-gesture-handler"
          - "react-native-get-random-values"
          - "react-native-reanimated"
          - "react-native-safe-area-context"
          - "react-native-screens"
          - "react-native-svg"
          - "react-native-view-shot"
          - "react-native-web"
          - "react-native-worklets"
        update-types: ["patch"]
    ignore:
      - dependency-name: "expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native-async-storage/async-storage"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native-community/datetimepicker"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@sentry/react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@shopify/flash-list"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-gesture-handler"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-get-random-values"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-reanimated"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-safe-area-context"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-screens"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-svg"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-view-shot"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-web"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-worklets"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  # Keeps SHA-pinned actions current; the version comment is updated too.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # Wait a week before adopting new releases, so compromised versions are caught first.
    cooldown:
      default-days: 7
