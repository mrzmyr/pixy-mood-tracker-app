name: sitemap

# Developers capture on their Mac and commit apps/sitemap/sitemap.json with
# the code; ci.yml checks it. This job only deletes Blob files main stopped
# using. Vercel deploys apps/sitemap from main.
on:
  push:
    branches: [main]
    paths: [apps/sitemap/sitemap.json]
  workflow_dispatch:

concurrency:
  group: sitemap
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun ci
      - name: Prune Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: bun sitemap prune --days=30
