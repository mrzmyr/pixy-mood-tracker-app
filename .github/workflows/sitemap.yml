name: sitemap

# Capture every screen of main and deploy the sitemap. Same CLI as local
# runs: `bun sitemap capture`, then `bun sitemap deploy`.
on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes the run: capture refuses a HEAD behind origin/main.
concurrency:
  group: sitemap
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sitemap:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      XCODE_APP: /Applications/Xcode_26.4.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP"
      - name: Install dependencies
        run: bun ci
      - name: Native fingerprint
        id: fingerprint
        run: |
          hash=$(EXPO_PUBLIC_APP_VARIANT=preview bun -e 'import { createFingerprintAsync } from "@expo/fingerprint"; console.log((await createFingerprintAsync(process.cwd())).hash)')
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      # Release shell: one native build per fingerprint, then cached.
      - name: Restore Release shell
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pixy-mood-tracker/build-cache
          key: sitemap-shell-${{ runner.arch }}-${{ steps.fingerprint.outputs.hash }}
      # Same key scheme as local: cache entries are named by input hash, so
      # any earlier run's entries are valid for every later commit.
      - name: Restore captures
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/pixy-mood-tracker/sitemap/states
            ~/.cache/pixy-mood-tracker/sitemap/png
          key: sitemap-captures-v1-${{ runner.arch }}-${{ github.sha }}
          restore-keys: sitemap-captures-v1-${{ runner.arch }}-
      - name: Build Release shell
        run: |
          if ! bun builds list --platform=ios | grep -q "${{ steps.fingerprint.outputs.hash }}" ; then
            bun app build --platform=ios
          fi
      - name: Capture
        run: bun sitemap capture --verify=2
      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SITEMAP_VERCEL_SCOPE: ${{ secrets.SITEMAP_VERCEL_SCOPE }}
        run: bun sitemap deploy
      - name: Upload failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sitemap-failures
          path: ~/.cache/pixy-mood-tracker/sitemap/runs/*/failures
          if-no-files-found: ignore
