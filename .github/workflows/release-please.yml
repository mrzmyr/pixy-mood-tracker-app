on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to rebuild and auto-submit (after credential changes such as HealthKit)
        type: choice
        options:
          - ios
          - android
          - both
        default: ios
name: release-please

permissions: {}

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: google-github-actions/release-please-action@e4dc86ba9405554aeba3c6bb2d169500e7d3b4ee # v4.1.1
        with:
          release-type: expo
          package-name: release-please-action
          bootstrap-sha: 880ad4c4d939d3e62d24cbeeaf7e864405727fe6
          changelog-types: '[{"type":"feat","section":"Features","hidden":false},{"type":"fix","section":"Bug Fixes","hidden":false},{"type":"chore","section":"Miscellaneous","hidden":false},{"type":"refactor","section":"Refactors","hidden":false},{"type":"style","section":"Styling","hidden":false},{"type":"docs","section":"Documentation","hidden":false}]'

  store-release:
    name: Build and submit ${{ matrix.platform }}
    needs: release-please
    # Push: only when release-please cut a release. Dispatch: manual rebuild (e.g. after HealthKit profile sync).
    # Do not reference matrix here (job-level if cannot use matrix context).
    if: |
      always() && (
        (github.event_name == 'push' && needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true')
        || (
          github.event_name == 'workflow_dispatch'
          && (github.event.inputs.platform == 'both' || github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'android')
        )
      )
    runs-on: ubuntu-latest
    # Wait for EAS so a failed build fails CI instead of going green on queue.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # ios -> TestFlight, android -> Google Play internal track (eas.json submit profile)
        platform: [ios, android]
    concurrency:
      group: store-release-${{ matrix.platform }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Skip platform not selected for dispatch
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.platform != 'both' && github.event.inputs.platform != matrix.platform
        run: |
          echo "Skipping ${{ matrix.platform }} (dispatch platform=${{ github.event.inputs.platform }})"
          exit 0

      - name: Checkout released commit
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'both' || github.event.inputs.platform == matrix.platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On release: the tag commit. On dispatch: the commit this workflow ran against.
          ref: ${{ needs.release-please.outputs.release_sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'both' || github.event.inputs.platform == matrix.platform
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Set up Bun
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'both' || github.event.inputs.platform == matrix.platform
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Set up Expo and EAS
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'both' || github.event.inputs.platform == matrix.platform
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # 9.0.0
        with:
          eas-version: 25.1.1
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'both' || github.event.inputs.platform == matrix.platform
        run: bun ci

      - name: Build and submit ${{ matrix.platform }} release
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'both' || github.event.inputs.platform == matrix.platform
        env:
          EXPO_PUBLIC_APP_VARIANT: production
          PLATFORM: ${{ matrix.platform }}
        # No --freeze-credentials: EAS must refresh the App Store profile when entitlements change (e.g. HealthKit).
        # No --no-wait: job fails if the EAS build or auto-submit fails.
        run: >-
          eas build --platform "$PLATFORM" --profile production --auto-submit --non-interactive
