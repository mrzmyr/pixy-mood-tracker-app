on:
  push:
    branches:
      - main
name: release-please

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: google-github-actions/release-please-action@e4dc86ba9405554aeba3c6bb2d169500e7d3b4ee # v4.1.1
        with:
          release-type: expo
          package-name: release-please-action
          bootstrap-sha: 880ad4c4d939d3e62d24cbeeaf7e864405727fe6
          changelog-types: '[{"type":"feat","section":"Features","hidden":false},{"type":"fix","section":"Bug Fixes","hidden":false},{"type":"chore","section":"Miscellaneous","hidden":false},{"type":"refactor","section":"Refactors","hidden":false},{"type":"style","section":"Styling","hidden":false},{"type":"docs","section":"Documentation","hidden":false}]'

  store-release:
    name: Build and submit ${{ matrix.platform }}
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # ios -> TestFlight, android -> Google Play internal track (eas.json submit profile)
        platform: [ios, android]
    concurrency:
      group: store-release-${{ matrix.platform }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.release_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # 9.0.0
        with:
          eas-version: 21.4.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: bun ci

      - name: Build and submit ${{ matrix.platform }} release
        env:
          EXPO_PUBLIC_APP_VARIANT: production
          PLATFORM: ${{ matrix.platform }}
        run: >-
          eas build --platform "$PLATFORM" --profile production --auto-submit --non-interactive --no-wait --freeze-credentials
